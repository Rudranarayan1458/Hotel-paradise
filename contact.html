<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Hotel Paradise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Hotel Paradise</h1>
</header>

<form class="contact-form">

    <input type="text" placeholder="Enter Your Name" required>

    <input type="email" placeholder="Enter Your Email" required>

    <input type="tel" placeholder="Phone Number" required>

    <input type="text" placeholder="Subject" required>

    <textarea placeholder="Write Your Message" rows="5" required></textarea>

    <button type="submit">Send Message</button>

</form>

<div class="contact-info">
    <h2>Hotel Information</h2>
    <p>📍 Address: Bhubaneswar, Odisha, India</p>
    <p>📞 Phone: +91 9692763968</p>
    <p>✉ Email: hotelparadise@gmail.com</p>
</div>

</body>
</html>
